        "description": "Range is [from,to). OHLC up to 31 days; daily snapshots up to 3660 days; at most 50000 records. Ten-second processing deadline. Events are observations, not inferred incident onsets. Replays of an unchanged rule are idempotent. Rule changes during processing abort the atomic write with 409."
