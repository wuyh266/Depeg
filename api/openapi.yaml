        "description": "No synthetic OHLC. Half-open [from,to) range, at most 3660 days. Missing values are null with quality flags. Preserve the same query while following next_cursor.",
        "parameters": [
          {
            "name": "asset_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Imported CoinGecko asset ID, e.g. coingecko.usd-coin"
          },
          {
            "name": "source",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "from",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "RFC3339 UTC boundary. Supply both; defaults to the last 24 hours when both are omitted."
          },
          {
            "name": "to",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "RFC3339 UTC boundary. Supply both; defaults to the last 24 hours when both are omitted."
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 2000,
              "default": 500
            }
          }
        ],
        "summary": "Daily price, market cap and 24-hour volume observations"
      }
